name: Build KROP APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Prepare Android Platform
        run: |
          cordova platform add android || echo "Platform already exists"
      - name: Build Android Release
        run: |
          cordova build android --release -- --keystore=krop-release-key.jks --storePassword=123456 --alias=krop-alias --password=123456
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: krop-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
